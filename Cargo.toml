[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Size settings for the deployed Pinocchio program (programs/slana-lean) and the crates only it
# uses. Cargo forbids per-package `panic`/`lto`/`strip`; they are not needed: the SBF target is
# already `panic-strategy: abort`, `lto = "fat"` above applies to the lean cdylib too, and
# cargo build-sbf strips the .so it copies to target/deploy. The Anchor reference build
# (programs/slana-ref) is unaffected: none of these packages are in its dependency graph.
[profile.release.package.slana-lean]
opt-level = "z"
# The lean program does its value arithmetic with explicit `checked_*` (returning the
# reference's `MathOverflow`/`ArithmeticOverflow`, see the plan's Review Focus 5); implicit
# overflow checks would only add panic paths (with file-name strings) to offset arithmetic
# that cannot overflow. Host tests (`cargo test`, dev profile) keep overflow checks on.
overflow-checks = false

[profile.release.package.pinocchio]
opt-level = "z"

[profile.release.package.pinocchio-log]
opt-level = "z"

[profile.release.package.pinocchio-system]
opt-level = "z"

[profile.release.package.pinocchio-token]
opt-level = "z"

[profile.release.package.pinocchio-token-2022]
opt-level = "z"
