[package]
name = "solagel-compact"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
name = "solagel_compact"

[features]
default = ["custom-panic"]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
borsh = { version = "1.8.1", default-features = false, features = ["derive"] }
solana-account-info = "3.1.1"
solana-clock = "3.2.1"
solana-cpi = "3.1.0"
solana-instruction = { version = "3.5.1", default-features = false, features = ["std"] }
solana-msg = "3.1.0"
solana-program-entrypoint = "3.1.1"
solana-program-error = "3.0.1"
solana-pubkey = { version = "4.3.0", default-features = false, features = ["borsh", "curve25519"] }
solana-rent = "3.1.0"
solana-sysvar = "3.1.1"

[dev-dependencies]
solana-system-interface = { version = "3.3.0", features = ["bincode"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
