[package]
name = "slana-lean"
version = "0.1.0"
description = "Slana: the deployed Pinocchio program, wire-compatible with the Anchor reference in programs/slana-ref"
license = "MIT"
edition.workspace = true
rust-version.workspace = true

# Build with `scripts/build-lean.sh` (cargo build-sbf → target/deploy/slana_lean.so). Size
# settings live in the root Cargo.toml (`[profile.release.package.slana-lean]` + the
# build script's env); they never touch the Anchor reference build.

[lib]
# cdylib only: a `lib` crate type next to it disables LTO in cargo build-sbf (the stub grows
# from 3,424 to 4,328 bytes). Host-side conformance checks are unit tests in this crate.
crate-type = ["cdylib"]
name = "slana_lean"

[dependencies]
# Exact pins: checked against Agave 4.3 / platform-tools v1.57 (rustc 1.95) and host Rust 1.97.1.
# `default-features = false` drops `alloc` (no allocator in this program), `copy` and `sha2`.
pinocchio = { version = "=0.11.2", default-features = false, features = ["cpi"] }
pinocchio-log = { version = "=0.5.1", default-features = false }
pinocchio-system = { version = "=0.6.1", default-features = false }
pinocchio-token = { version = "=0.7.0", default-features = false }
pinocchio-token-2022 = { version = "=0.4.0", default-features = false }

[dev-dependencies]
# Conformance oracle: the Anchor reference (lib `slana`). Host-only, never in the .so.
slana-ref = { path = "../slana-ref" }
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", features = ["token", "token_2022"] }
serde_json = "1"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
