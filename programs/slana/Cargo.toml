[package]
name = "slana"
version = "0.1.0"
description = "Slana: cute coin-themed on-chain Agar.io (identity, stakes, seasons, prizes)"
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "slana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.1", features = ["token", "token_2022", "associated_token"] }
# SHA-256 for the Pass commit–reveal (`sol_sha256` syscall on-chain; `sha2` only on the host).
# Anchor 1.2.1's `solana_program` re-export has no `hash` module.
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
litesvm = "0.17.0"
solana-account = "4"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3.1"
solana-transaction-error = "3.4"
bincode = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
