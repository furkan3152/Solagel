name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript + contracts (contracts · shared · art · sdk · server · web)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # English only: fails on any Turkish-specific letter (c-cedilla, g-breve, dotless i, o-umlaut,
      # s-cedilla, u-umlaut and their capitals) in a tracked text file. The letters are written as
      # PCRE code points so this file passes its own check; images are skipped as binaries.
      - name: English-only guard (no Turkish letters in tracked text files)
        # git grep exits 0 on a match, 1 on no match, anything else on an error (which must fail too).
        run: |
          rc=0
          LC_ALL=C.UTF-8 git grep -InP '[\x{e7}\x{11f}\x{131}\x{f6}\x{15f}\x{fc}\x{c7}\x{11e}\x{130}\x{d6}\x{15e}\x{dc}]' -- . ':!*.webp' ':!*.png' ':!*.jpg' || rc=$?
          if [ "$rc" -eq 0 ]; then echo "Turkish text found"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "git grep failed (exit $rc)"; exit 1; fi
          echo "No Turkish text"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # forge-std (a contracts test dependency) is a git dependency; fetch it over HTTPS, not SSH.
      - name: Git dependencies over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: pnpm install --frozen-lockfile
      # Solidity is compiled here and nowhere else. The exported artifacts (ABIs, bytecode, the pinned
      # runtime code hash) are committed: a contract change without a fresh export fails the diff.
      - name: Contracts (build, artifacts in sync, unit + fuzz tests)
        run: |
          pnpm -F @elymum/contracts build
          git diff --exit-code packages/contracts/src/artifacts.ts
          pnpm -F @elymum/contracts typecheck
          pnpm -F @elymum/contracts test
      - name: Shared
        run: pnpm -F @elymum/shared typecheck && pnpm -F @elymum/shared test
      - name: Art
        run: pnpm -F @elymum/art typecheck && pnpm -F @elymum/art test
      - name: SDK
        run: pnpm -F @elymum/sdk typecheck && pnpm -F @elymum/sdk test
      - name: Server
        run: pnpm -F @elymum/server typecheck && pnpm -F @elymum/server test && pnpm -F @elymum/server build
      - name: Web
        run: pnpm -F @elymum/web typecheck && pnpm -F @elymum/web test && pnpm -F @elymum/web build

  docker:
    name: Docker image (build only, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t elymum:ci .
