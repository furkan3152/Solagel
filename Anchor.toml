skip_local_validator = true

[toolchain]

# Only the Anchor reference is an Anchor program: it is the IDL/TS-types source and the
# conformance oracle, and it is never deployed. The deployed program is programs/slana-lean
# (Pinocchio), built by scripts/build-lean.sh into target/deploy/slana_lean.so.
[workspace]
members = ["programs/slana-ref"]

[features]
resolution = true
skip-lint = false

[programs.localnet]
slana = "5skf5Twyqr8M84dJ8RLGfz1NU6fR3zPDRLUvGd5y7472"

[programs.devnet]
slana = "5skf5Twyqr8M84dJ8RLGfz1NU6fR3zPDRLUvGd5y7472"

[programs.mainnet]
slana = "5skf5Twyqr8M84dJ8RLGfz1NU6fR3zPDRLUvGd5y7472"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "scripts/test-program.sh"

[hooks]
