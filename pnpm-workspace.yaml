packages:
  - "packages/*"
  - "apps/*"

onlyBuiltDependencies:
  - esbuild
  - bufferutil
  - utf-8-validate

# Security: any transitive toml stays at >=4.2.0 (GHSA advisories fixed there). Nothing in the
# workspace needs it today; drop this override together with a lockfile refresh (it is recorded in
# pnpm-lock.yaml, so removing it alone breaks `pnpm install --frozen-lockfile`).
overrides:
  toml: ^4.2.0
