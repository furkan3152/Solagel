<!doctype html>
<html lang="en">
<head>

<title>Elymum Roadmap Chomp stage</title>
<style>
  html, body { margin: 0; background: #04181C; overflow: hidden; }
  canvas { display: block; }
</style>

<body>
<canvas id="stage"></canvas>
<script>
  // the frame size comes from the URL (?w=&h=): 1920x1080, 1080x1920, 1080x1080

</script>
